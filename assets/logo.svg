<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo SR Facilities — monograma SR em dourado com tipografia institucional -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="SR Facilities">
  <defs>
    <linearGradient id="ouro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#A8853A"/>
    </linearGradient>
  </defs>
  <!-- Emblema: losango com monograma SR -->
  <g>
    <rect x="6" y="8" width="48" height="48" rx="10" fill="none" stroke="url(#ouro)" stroke-width="2"/>
    <text x="30" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="url(#ouro)" text-anchor="middle" letter-spacing="1">SR</text>
  </g>
  <!-- Nome da empresa -->
  <text x="66" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FFFFFF" letter-spacing="2">FACILITIES</text>
  <text x="67" y="50" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#C9A24B" letter-spacing="1.8">SERVIÇOS PROFISSIONAIS</text>
</svg>
