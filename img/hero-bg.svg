<?xml version="1.0" encoding="UTF-8"?>
<!-- Fundo do hero — composição geométrica premium em preto, grafite e dourado -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fundo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0C"/>
      <stop offset="55%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#1C1E22"/>
    </linearGradient>
    <linearGradient id="linhaOuro" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A24B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho" cx="75%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#fundo)"/>
  <rect width="1920" height="1080" fill="url(#brilho)"/>
  <!-- Linhas diagonais em grafite -->
  <g stroke="#2A2D33" stroke-width="1.5" opacity="0.8">
    <line x1="1150" y1="-50" x2="1750" y2="1130"/>
    <line x1="1280" y1="-50" x2="1880" y2="1130"/>
    <line x1="1410" y1="-50" x2="2010" y2="1130"/>
    <line x1="1020" y1="-50" x2="1620" y2="1130"/>
  </g>
  <!-- Detalhes dourados -->
  <line x1="1215" y1="-50" x2="1815" y2="1130" stroke="url(#linhaOuro)" stroke-width="2"/>
  <line x1="1345" y1="-50" x2="1945" y2="1130" stroke="url(#linhaOuro)" stroke-width="1.5" opacity="0.7"/>
  <!-- Losangos decorativos -->
  <g fill="none" stroke="#C9A24B" opacity="0.22">
    <rect x="1500" y="180" width="120" height="120" rx="18" stroke-width="1.5" transform="rotate(45 1560 240)"/>
    <rect x="1320" y="640" width="80" height="80" rx="12" stroke-width="1.2" transform="rotate(45 1360 680)"/>
    <rect x="1680" y="500" width="180" height="180" rx="24" stroke-width="1.5" transform="rotate(45 1770 590)"/>
  </g>
</svg>
